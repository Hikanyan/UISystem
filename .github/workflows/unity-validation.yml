name: Unity package validation
on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated consumer project
        shell: pwsh
        run: ./Tools/Prepare-ValidationProject.ps1 -Destination ValidationProject
      - name: Test packages and imported sample
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ValidationProject
          unityVersion: 6000.3.15f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-${{ matrix.testMode }}
          path: |
            artifacts
            ValidationProject/TestResults
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./Tools/Prepare-ValidationProject.ps1 -Destination ValidationProject
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ValidationProject
          unityVersion: 6000.3.15f1
          targetPlatform: StandaloneLinux64
          buildMethod: ValidationBuild.Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-build
          path: ValidationProject/Build
